[package]
name = "relayer-utils"
version = "0.4.62-21"
authors = ["Sora Suegami", "Aditya Bisht"]
license = "MIT"
edition = "2018"
resolver = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
itertools = "0.10.3"
serde_json = "1.0.95"
serde = { version = "1.0.159", features = ["derive"] }
zk-regex-compiler = { git = "https://github.com/zkemail/zk-regex.git", tag = "3.0.0-alpha.1" }
hex = "0.4.3"
anyhow = "1.0.75"
thiserror = "1.0"
fancy-regex = "0.13.0"
halo2curves = { git = "https://github.com/privacy-scaling-explorations/halo2curves.git", rev = "8771fe5a5d54fc03e74dbc8915db5dad3ab46a83", default-features = false }
poseidon-rs = { git = "https://github.com/zkemail/poseidon-rs.git", version = "1.0.0" }
rand_core = { version = "0.6", default-features = false }
num-bigint = "0.4.4"
num-traits = "0.2.19"
rsa = { version = "0.9.6", features = ["serde"] }
# NOTE: pinned to zkemail/cfdkim#3 (canonicalize_verified_signed_email); switch back to the
# default branch once it is merged.
cfdkim = { git = "https://github.com/zkemail/cfdkim.git", rev = "405e9c25253face93e3503330a8a6453e21f7342" }
hmac-sha256 = { git = "https://github.com/zkemail/rust-hmac-sha256.git" }
ethers = "2.0.14"
reqwest = "0.11.22"
slog = { version = "2.7.0", features = [
    "max_level_trace",
    "release_max_level_warn",
] }
slog-async = "2.8.0"
slog-term = "2.9.0"
slog-json = "2.6.1"
lazy_static = "1.4"
file-rotate = "0.7.5"
regex = "=1.10.6"
mailparse = "0.15.0"
wasm-bindgen = "0.2.95"
wasm-bindgen-futures = "0.4.45"
js-sys = "0.3.72"
serde-wasm-bindgen = "0.6.5"
rand = "0.8.5"
base64 = "0.22.1"
console_error_panic_hook = "0.1.7"
sha2 = "0.10"
sha1 = "0.10"
digest = "0.10"
ed25519-dalek = "2"
sp1-verifier = { version = "=6.1.0", default-features = false }

# NOTE: only for the archive 429 retry delay (no timer is available in the wasm build).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1.41", features = ["full"] }
